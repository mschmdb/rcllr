name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older runs. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Pull requests test only Node 24; main tests both lines. The Node 22 jobs still report,
      # because the ruleset requires every job name, but skip their steps and free the runner fast.
      FULL: ${{ matrix.node == '24' || github.event_name != 'pull_request' }}
      # pnpm runs package scripts with cmd on Windows; the scripts are POSIX shell.
      npm_config_script_shell: ${{ matrix.os == 'windows-latest' && 'C:\Program Files\Git\bin\bash.exe' || '' }}
    steps:
      - if: env.FULL == 'true'
        name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - if: env.FULL == 'true'
        uses: actions/checkout@v7
      - if: env.FULL == 'true'
        uses: pnpm/action-setup@v6
      - if: env.FULL == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - if: env.FULL == 'true'
        name: Configure Git for test repositories
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - if: env.FULL == 'true'
        name: Install the packages, not the site
        run: pnpm install --frozen-lockfile --filter "./packages/**" --filter rcllr-workspace
      - if: env.FULL == 'true'
        name: Type check
        run: pnpm typecheck
      - if: env.FULL == 'true'
        name: Unit tests
        run: pnpm test
      - if: env.FULL == 'true'
        name: Black-box suite against the built CLI
        run: pnpm test:blackbox:dist
      - if: env.FULL == 'true'
        name: Pack, install and run the npm tarballs
        run: pnpm pack:check

  toml-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install the packages, not the site
        run: pnpm install --frozen-lockfile --filter "./packages/**" --filter rcllr-workspace
      - name: TOML parser against the official toml-test suite
        run: pnpm test:toml

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Install the site and what it needs
        run: pnpm install --frozen-lockfile --filter site...
      - name: Type check
        run: pnpm --dir site check
      - name: Tests (contrast, theme)
        run: pnpm --dir site test
      - name: Build
        run: pnpm --dir site build
      - name: Build the image Coolify deploys
        run: docker build -f site/Dockerfile -t rcllr-site .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan full history with gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact -v
